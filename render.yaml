services:
  - type: web
    name: future-blink-shopify-app
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SCOPES
        value: write_products,write_metafields
